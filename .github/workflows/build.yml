name: Build ImmortalWrt
on:
  workflow_dispatch:  # ✅ 网页手动点 Run workflow（推荐，不自动跑）
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 最长6小时，imm体积大很容易超时
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-pip python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - name: 缓存dl目录（大幅减少编译时间）
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-imm-dl-${{ hashFiles('feeds.conf.default') }}

      - name: 更新feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入你的配置
        run: |
          cp .config .config.bak
          make defconfig

      - name: 开始编译
        run: |
          make -j$(nproc) V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/
